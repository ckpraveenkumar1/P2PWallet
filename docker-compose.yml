services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: p2pwallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d p2pwallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/p2pwallet
      SPRING_DATASOURCE_USERNAME: wallet
      SPRING_DATASOURCE_PASSWORD: wallet_secret
      USER_TOKENS: "alice:tok_alice,bob:tok_bob,charlie:tok_charlie,dave:tok_dave"
    restart: unless-stopped

volumes:
  pgdata:
