databases:
  - name: p2pwallet-db
    plan: free
    databaseName: p2pwallet
    user: wallet

services:
  - type: web
    name: p2p-wallet
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: p2pwallet-db
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: p2pwallet-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: p2pwallet-db
          property: password
      - key: USER_TOKENS
        value: "alice:tok_alice,bob:tok_bob,charlie:tok_charlie,dave:tok_dave"
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: p2pwallet-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: p2pwallet-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: p2pwallet-db
          property: password
    healthCheckPath: /actuator/health
